<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Compact Investigations</title>
  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    body { margin: 0; background: #f4f6f8; color: #17202a; }
    main { max-width: 760px; margin: 40px auto; padding: 0 18px; }
    .card { background: white; border: 1px solid #dfe5ea; border-radius: 12px; padding: 22px; box-shadow: 0 4px 18px rgba(0,0,0,.05); }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { line-height: 1.45; }
    .muted { color: #66727d; font-size: 14px; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 18px; }
    input[type=file] { flex: 1; min-width: 260px; }
    button { border: 0; border-radius: 8px; padding: 10px 16px; font-weight: 650; cursor: pointer; background: #1f6feb; color: white; }
    button:disabled { opacity: .55; cursor: default; }
    #status { margin-top: 18px; padding: 12px; border-radius: 8px; background: #f7f9fb; white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; min-height: 38px; }
    .ok { color: #176b39; }
    .err { color: #a12622; }
  </style>
</head>
<body>
<main>
  <div class="card">
    <h1>Compact Investigation Generator</h1>
    <p class="muted">The PDF is processed locally in this browser. Nothing is uploaded by this page.</p>

    <div class="row">
      <input id="pdfFile" type="file" accept="application/pdf,.pdf" />
      <button id="generate" disabled>Generate Word (RTF)</button>
    </div>

    <div id="status">Loading PDF engine…</div>
  </div>
</main>
<script type="module">
  const statusBox = document.getElementById('status');
  if (location.protocol === 'file:') {
    statusBox.className = 'err';
    statusBox.textContent = 'This page was opened as a local file. Please open it through your internal HTTP/HTTPS server (for example http://server/compact/).';
  } else {
    import('./app.js').catch((err) => {
      console.error(err);
      statusBox.className = 'err';
      statusBox.textContent = 'Application failed to load. Most commonly the server is not serving JavaScript files correctly.\n\n' + (err?.message || err);
    });
  }
</script>
</body>
</html>
