<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BPROAD Trial Critical Appraisal Presentation</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --panel: #1e293b;
      --ink: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .title { font-weight: 700; font-size: 1.05rem; }
    .controls { display: flex; align-items: center; gap: 0.75rem; }
    .btn {
      background: #334155;
      color: var(--ink);
      border: 1px solid var(--border);
      padding: 0.4rem 0.85rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      text-decoration: none;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--accent); color: #0f172a; }
    .pdf-container {
      flex: 1;
      width: 100%;
      height: 100%;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="title">BPROAD Trial Critical Appraisal Presentation</div>
    <div class="controls">
      <button class="btn" onclick="toggleFullScreen()">Full Screen ⛶</button>
      <a href="bproad.pdf" download class="btn">Download PDF 📥</a>
      <a href="agenticgrandrounds.html" class="btn">Index 🏠</a>
    </div>
  </header>
  <div class="pdf-container" id="viewer-box">
    <iframe src="bproad.pdf#toolbar=1&view=FitH" type="application/pdf"></iframe>
  </div>

  <script>
    function toggleFullScreen() {
      const elem = document.getElementById('viewer-box');
      if (!document.fullscreenElement) {
        elem.requestFullscreen().catch(err => alert(err.message));
      } else {
        document.exitFullscreen();
      }
    }
  </script>
</body>
</html>
